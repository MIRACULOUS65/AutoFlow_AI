[project]
name = "autoflow-ai"
version = "0.1.0"
description = "AutoFlow AI — intelligence and execution core (headless, API-first agentic task execution)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AutoFlow AI" }]

dependencies = [
    "chromadb>=0.5,<2.0",
    "pydantic>=2.9,<3.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=4.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
]
# Windows desktop control (Phase 7). Optional: the AI/ML core imports it lazily
# and unit tests run without it. Only needed for real desktop automation.
windows = [
    "uiautomation>=2.0,<3.0",
]
# Vision / deterministic CV (bundled milestone). Optional; imported lazily.
vision = [
    "opencv-python-headless>=4.9,<6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "mss>=9.0",
]
# Browser automation (bundled milestone). Optional; imported lazily.
browser = [
    "playwright>=1.40,<2.0",
]
# On-device tool-calling agent (Cactus Needle 2). Optional; imported lazily on
# first use so the base package + test suite are unaffected when unused. The
# fine-tuned weights (~14MB my_agent.cact) ship inside the package.
needle = [
    "cactus-needle>=2.0,<3.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
autoflow = "autoflow_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoflow_ai"]
# Ship the bundled fine-tuned Needle weights inside the wheel/package.
artifacts = ["src/autoflow_ai/needle_agent/weights/*.cact"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "contract: schema/contract-level tests",
    "unit: unit tests",
    "integration: integration/end-to-end tests with real side effects",
]

[tool.coverage.run]
branch = true
source = ["autoflow_ai"]
