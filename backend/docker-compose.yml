# Infrastructure services for the production-style local stack.
# The backend itself runs directly (uvicorn) during development.
#
#   docker compose up -d
#   # then set in .env:
#   #   DATABASE_URL=postgresql+asyncpg://autoflow:autoflow@localhost:5432/autoflow
#   #   REDIS_URL=redis://localhost:6379/0
#
# The dev default (SQLite + in-process queue) needs none of this.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autoflow
      POSTGRES_PASSWORD: autoflow
      POSTGRES_DB: autoflow
    ports:
      - "5432:5432"
    volumes:
      - autoflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autoflow_pgdata:
